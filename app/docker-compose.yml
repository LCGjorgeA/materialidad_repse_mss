services:
  postgres:
    image: postgres:16
    container_name: portal_mss_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: portal_mss
    ports:
      - "5432:5432"
    volumes:
      - portal_mss_pgdata:/var/lib/postgresql/data

volumes:
  portal_mss_pgdata:
